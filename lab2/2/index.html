<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Georgia, 'Times New Roman', Times, serif;
        }
        th, td {
            padding: 5px;
        }
        .bar {
            height: 20px;
            text-align: left;
            color: black;
            padding-right: 100px;
            font-weight: bold;
        }
        .blueviolet {background-color: blueviolet;}
        .blue {background-color: blue;}
        .green {background-color: green;}
        .yellow {background-color: yellow;}
        .red {background-color: red;}
    </style>
</head>
<body>
    <h1>Student Scores</h1>
    <table>
        <tr>
            <th>ID</th>
            <th>Student</th>
            <th>Score</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Nancy Freehafer</td>
            <td><div class="bar blueviolet" style="width: 98%;">98</div></td>
        </tr>
        <tr>
            <td>2</td>
            <td>Andrew Cencini</td>
            <td><div class="bar blue" style="width: 40%;">40</div></td>
        </tr>
        <tr>
            <td>3</td>
            <td>Jan Kotas</td>
            <td><div class="bar green" style="width: 75%;">75</div></td>
        </tr>
        <tr>
            <td>4</td>
            <td>Mariya Sergienko</td>
            <td><div class="bar yellow" style="width: 80%;">80</div></td>
        </tr>
        <tr>
            <td>5</td>
            <td>Seven Thrope</td>
            <td><div class="bar red" style="width: 67%;">67</div></td>
        </tr>
    </table>
</body>
</html>
